# vectr internal configuration — versioned in the repo.
# All tunables that affect ranking behaviour live here so changes are auditable
# via git history rather than buried in code.
#
# Do NOT set these via environment variables or per-user config files.
# Runtime code reads this file via importlib.resources so it works for both
# the repo-local interpreter and the pip-installed global binary.

ranking:
  quality_priors:
    # Multipliers applied to the hybrid similarity score. 1.0 = neutral.
    # Lower = de-ranked further. Applied in chunk_quality.quality_score().

    # Bare stub chunks with almost no content (single-line import, lone brace, etc.)
    trivial: 0.15

    # Maximum number of non-blank lines a HTML/markup or plain-text chunk may contain
    # and still be classified as trivial by is_trivial_chunk() (UPG-15.5).
    # 1-line and 2-line test-fixture templates ("Logged out", "{{ form }}", top_level.txt)
    # are trivial; any real doc prose chunk has many more lines than this.
    # Must be a small integer (≥1) so that multi-line .txt/.rst documentation
    # (a framework's docs/howto/*.txt, docs/topics/*.txt) are NOT classified trivial.
    # Conservative default: 2 — catches single-line HTML templates and 1–2-line
    # TXT fixtures without risk of demoting substantive documentation.
    trivial_doc_max_lines: 2

    # Re-export / import-only "navigational" chunks (no implementation substance)
    navigational: 0.35

    # UPG-NAV-OVERDEMOTE-DECL (F59): a bare-constructor-manifest chunk (UPG-
    # PREFIX-COMPOSE's ``request_started = Signal()`` pattern) is ALSO the
    # corpus-wide unique declaration site of each name it assigns. For a
    # conceptual query ("signal dispatcher implementation") the manifest is
    # correctly navigational-demoted to `navigational` above (F44/F53's
    # re-export-stub-overrank fix). For a query that names one of the
    # declared identifiers directly ("where is request_started signal
    # defined") — a lexical match, gated on the query's own BM25 tokens, not
    # a keyword list — the chunk IS the singular correct answer and the full
    # navigational demotion buries it (F59: a framework's core signals module
    # absent from top-25 despite being in the candidate pool). This softened value
    # applies only in that lexically-gated case (chunk_quality.quality_score
    # query_tokens argument); every other query for the same chunk still
    # gets the full `navigational` demotion. Measured against the F59 offline
    # replay (benchmarks/acceptance/product_cases.jsonl over a large web-framework
    # corpus): the pool-rank gap needs a value in this
    # range to surface the chunk in top-10 without letting the still-nav-
    # shaped chunk outrank undemoted real implementation code (kept < 1.0).
    navigational_declaration_rescue: 0.75

    # Markdown chunks that contain only headings (no prose or code body)
    heading_only: 0.40

    # Machine-generated files (migrations, protobuf output, build artifacts)
    generated: 0.45

    # vectr's own config files — we never want to surface our own internals
    vectr_config: 0.10

    # Test files when the query does not explicitly target tests. UPG-PREFIX-
    # COMPOSE: lowered from 0.55 — once the query-prefix fix (UPG-ARCTIC-QUERY-
    # PREFIX) changed dense pool composition, a test-file symbol whose name or
    # docstring happens to restate the query in plain language (e.g. a helper
    # class documented as "track threads and kwargs when signals are
    # dispatched") could out-rank the canonical production symbol it merely
    # name-echoes, because purpose_rank's textual-similarity boost (below) is
    # otherwise blind to quality tier. 0.46 is the largest reduction that still
    # satisfies test_ordering's invariant (test_deprioritised > generated=0.45,
    # tests/test_chunk_quality.py::TestQualityScore::test_ordering) — this value
    # only matters in combination with purpose_rank.lambda below (see there for
    # the joint tuning rationale); it does not fix anything on its own.
    test_deprioritised: 0.46

    # UPG-TESTPATH-FRAMEWORK-MISCLASS (F58): is_test_file()'s path-segment
    # heuristic (any "test"/"tests"/... directory component) cannot tell a
    # disposable test module apart from a shipped testing-FRAMEWORK subpackage
    # that happens to live at a test-named path (e.g. a web framework's
    # test/utils.py — a stable public API, not a throwaway test). Filtering by
    # "called only from non-test files" was measured and rejected: a testing
    # framework is, by definition, called almost exclusively from test code, so
    # that signal never fires (0/175 measured non-test callers of a
    # settings-override decorator on the corpus) even though the file plainly IS
    # shipped API surface.
    # The signal that DOES discriminate cleanly is corpus-wide unambiguous
    # caller BREADTH: symbol_graph.file_fan_in() counts, per file, the number
    # of DISTINCT calling files across edges whose target symbol name
    # resolves to exactly one defining file corpus-wide (excludes common
    # same-leaf collisions like __init__/setUp that would otherwise dilute
    # the count with unrelated files). Measured on a large web-framework corpus:
    # test/utils.py=285, test/testcases.py=518,
    # test/client.py=85, vs. the next-highest genuinely-disposable
    # test file at 42 and a median near 0 — a wide, well-separated gap.
    # A file at or above this threshold is exempted from the
    # test_deprioritised multiplier above regardless of its path.
    test_framework_fan_in_threshold: 60

    # substantive documentation prose vs implementation code
    doc_prose: 0.70

    # bodies with very few meaningful lines
    short_penalty: 0.80

    # A private/internal symbol (single leading underscore, e.g. `_helper`,
    # not a dunder like `__init__`) is a mild demotion vs. its public-API
    # sibling. This is a language-general naming convention (Python's PEP 8
    # "internal use" prefix; the same single-underscore-for-internal idiom
    # appears in Go, JS/TS, and Rust codebases too), not a corpus- or query-
    # specific rule, so it applies uniformly regardless of query text.
    # Root cause it addresses: a keyword-dense private helper's raw text can
    # score higher on cross-encoder + BM25 similarity than the public method
    # a natural-language query is actually asking about, because the helper's
    # body happens to restate more of the query's vocabulary literally (e.g.
    # a data-access filter helper's body mentions the query's collection/filter
    # vocabulary several times while the public method it supports has a terse
    # one-line body).
    # The importance/purpose priors (ranking.importance_prior, ranking.
    # purpose_rank) already favor the public symbol's file/class, but a
    # sizeable base-rerank gap from the raw-text-similarity effect above can
    # still outweigh them; this prior corrects the imbalance at its source
    # (a public data-access filter method vs. the private prefetch-filter
    # helper it delegates to is the measured witness case, UPG-16.1/F30).
    # Mild (comparable to
    # short_penalty) because a private helper is still legitimate,
    # sometimes-wanted code — just usually not the intended answer to a
    # concept-level query naming the public operation.
    private_symbol_deprioritised: 0.80

    # Maximum number of attribute-assignment body lines for an attribute-only
    # class body to be classified as trivial by is_trivial_chunk() (UPG-15.9 / F25).
    # A ``class Meta:`` inner stub with ≤ this many attribute-assignment body lines
    # and NO method definitions / control flow is trivial — it is a configuration
    # stub, not a real class definition.  Web-framework test files have 200+ such
    # 3-line stubs (an inner config class: a model attribute, a fields attribute)
    # that flood doc-intent
    # queries.  Real small library classes with more attributes or any method body
    # are unaffected.  Conservative default 3: catches the dominant Meta stub
    # pattern without risk of demoting real dataclass-style classes.
    trivial_attr_class_max_attrs: 3

  importance_prior:
    # ARCH-1b: file-level PageRank importance (computed at index time by ARCH-1a,
    # stored in the symbol_importance table) is blended into the FINAL search sort
    # as a relevance-gated multiplicative prior:
    #     final_score = base_rerank_score * quality_score * (1 + lambda * importance)
    # where importance ∈ [0,1] is the normalized file-level PageRank of the chunk's
    # file (0 when unknown). The multiply by base_rerank_score keeps it relevance-
    # gated — an irrelevant high-importance file (base ≈ 0) is not lifted. A global
    # standing prior (canonical = most-referenced), NOT a query-keyword heuristic.
    # lambda=0 disables it (behaviour identical to pre-ARCH-1b). Conservative default
    # 0.25: reorders near-ties toward canonical files without overriding clear
    # relevance. Live F22/F23 tuning is tracked in tasks.md ARCH-1b.
    lambda: 0.25

  class_importance:
    # ARCH-2: class/symbol-name "canonical = most-referenced" importance
    # (whole-word reference frequency of the name across the corpus, computed
    # at index time by SymbolGraph._compute_and_store_class_importance and
    # stored in the class_importance table) is blended into the FINAL search
    # sort as a second relevance-gated multiplicative prior, alongside
    # ARCH-1b's file-level prior:
    #     final_score = base_rerank_score * quality_score
    #                    * (1 + lambda_file * file_importance)
    #                    * (1 + lambda_class * class_importance)
    # where class_importance ∈ [0,1] is the normalized reference frequency of
    # the relevant name. This is the lever for same-leaf collisions (two
    # unrelated classes that both define a method with the same name; a
    # canonical type's own definition chunk crowded by a same-file, narrower
    # sibling type; a corpus-central module-level function crowded by a
    # rarely-referenced sibling function — UPG-SIBLING-TYPEDEF-CROWDING) that
    # file-level importance cannot discriminate — a symbol's own body often IS
    # the file, so file-level PageRank has no separating signal.
    #
    # UPG-SIBLING-TYPEDEF-CROWDING extended attribution beyond methods: a
    # METHOD chunk still uses its owning class's name (unchanged); a
    # TYPE-DEFINITION chunk (struct/enum/trait/class/interface/typedef) or a
    # MODULE-LEVEL FUNCTION chunk is instead attributed to its OWN name —
    # previously stuck at class_importance=0 forever since neither has an
    # owning-class context to key off. See agent/searcher.py
    # (is_type_definition_chunk / is_module_level_function_chunk gated
    # lookup).
    #
    # lambda=0 disables it (behaviour identical to pre-ARCH-2). The
    # multiplicative gate bounds the factor to [1, 1+lambda] regardless of how
    # skewed the importance map is, so a modest lambda here cannot let even a
    # maximum-importance rival overturn a clear cross-encoder relevance lead.
    # Live F22/F23 tuning is tracked in tasks.md ARCH-2.
    #
    # UPG-ACCEPT-REGRESSION-RECOVERY (wave2 2026-07-19): raised 0.25 -> 0.35.
    # The 2026-07-06 granite embedder swap changed dense-pool composition and
    # regressed six previously-passing acceptance cases; for the two whose
    # canonical class carries high class_importance but sat just outside the
    # cut (F14 QuerySet.exclude rank 4->3, F30 QuerySet.filter rank 7->5), the
    # 0.25 gate was too weak to reorder past low-class-importance look-alikes
    # (admin FieldListFilter / constraint classes). 0.35 recovers exactly those
    # two with ZERO regressions across the full 65-case acceptance corpus
    # (verified 33 pass / 24 fail vs the 31/26 baseline, only F14/F30 flipped).
    # The remaining four regressions are rerank-position/pool-composition losses
    # unreachable by class_importance at any lambda (see state/blocked.md).
    lambda: 0.35

  purpose_rank:
    # ARCH-4b: carries the ARCH-4 dual-vector purpose similarity (STEP-0/ARCH-4
    # gated it into POOL ENTRY only) into the FINAL search sort as a third
    # relevance-gated multiplicative prior, alongside ARCH-1b's file-level and
    # ARCH-2's class-level priors:
    #     final_score = base_rerank_score * quality_score
    #                    * (1 + lambda_file * file_importance)
    #                    * (1 + lambda_class * class_importance)
    #                    * (1 + lambda_purpose * purpose_sim)
    # where purpose_sim ∈ [0,1] is the chunk's own body-vs-purpose-vector cosine
    # similarity to the query (0 when the chunk has no purpose vector, e.g. a
    # doc/config chunk, or dual_vector is disabled). Without this, a symbol whose
    # signature+docstring is the single best purpose match in the corpus can still
    # be buried under its own subclasses/near-duplicates in the final MCP ranking,
    # because the cross-encoder rerank that dominates base_rerank_score only sees
    # BODY text and has no visibility into the purpose signal that got the chunk
    # into the pool in the first place. lambda=0 disables it (behaviour identical
    # to pre-ARCH-4b). Default 0.9 (raised from ARCH-4b's original 0.5 by
    # UPG-PREFIX-COMPOSE, see below), higher than ARCH-1b/ARCH-2's 0.25: those
    # two priors are typically fed near-binary importance scores (0 or ~1), so a
    # one-rank near-tie gap clears at 0.25; purpose_sim is a continuous cosine
    # similarity that rarely reaches 1.0 even for a strong match and must also
    # recover deeper rerank-pool burial (observed: purpose-rank-1 chunk landing
    # at final rank 16 in a ~60-candidate pool) — algebra on the multiplicative
    # gate shows 0.25 only clears a 1-of-10-rank gap, not a 15-of-60-rank gap.
    # See TestPurposeRankPrior in tests/test_indexer_searcher.py for the worked
    # cases.
    #
    # UPG-PREFIX-COMPOSE: purpose_sim measures textual similarity between the
    # query and a chunk's own qualified-name+docstring independent of the
    # chunk's quality tier, so a quality-demoted chunk (a test helper whose
    # docstring happens to restate the query in plain language) can carry a
    # HIGHER purpose_sim than the canonical production symbol it name-echoes —
    # letting a shallow textual echo outrank the real implementation no matter
    # how large lambda is scaled, since raising lambda amplifies the demoted
    # chunk's edge by the same factor (a case witnessed on a large web-framework
    # corpus: a test-only helper class's docstring out-scored the production
    # signal-dispatcher class's own docstring on raw cosine similarity). Raising this lambda
    # alone (against the un-weighted prior) to clear that gap also
    # disproportionately boosts every OTHER demoted-but-purpose-matching chunk
    # against non-symbol content that has no purpose vector at all (prose/doc
    # chunks default purpose_sim to 0 — see above), which was observed to
    # invert an unrelated doc-vs-test-code ranking on the same corpus. The
    # searcher now weights this factor by the chunk's own quality_score
    # (1 + lambda * purpose_sim * quality_score, in
    # agent/searcher.py._apply_quality_and_dedup) so a demoted chunk's textual
    # echo can no longer buy back more rank than an undemoted chunk's smaller
    # one, while an undemoted (quality=1.0) candidate keeps the full boost.
    # With that weighting, lambda=0.9 (paired with test_deprioritised=0.46
    # above) is stable across a lambda range of roughly [0.7, 1.1] on the
    # verified case above — not a knife-edge value — and the full offline
    # acceptance replay (benchmarks/acceptance/product_cases.jsonl)
    # shows zero other case flipped by this change.
    lambda: 0.9

  type_def_prior:
    # UPG-RUST-DEF-EVICTION / DEF-B: a fourth relevance-gated multiplicative
    # prior, same shape as file_importance/class_importance/purpose_rank
    # above:
    #     final_score = base_rerank_score * quality_score
    #                    * (1 + lambda_file * file_importance)
    #                    * (1 + lambda_class * class_importance)
    #                    * (1 + lambda_purpose * purpose_sim * quality_score)
    #                    * (1 + lambda_def * is_type_definition)
    # where is_type_definition is 1 when the chunk's own node_type is a TYPE
    # DEFINITION (struct/enum/trait/class/interface — see
    # chunk_quality.is_type_definition_chunk), else 0. Cross-language witness:
    # a struct/type's canonical definition chunk repeatedly loses to same-name
    # test code and usage sites at comparable rerank scores because the
    # cross-encoder has no visibility into "this chunk IS the definition" —
    # only the AST does. lambda=0 disables it (pre-DEF-B behaviour). Default
    # 0.15, smaller than class_importance/file_importance's 0.25: this prior
    # fires on every type-def chunk unconditionally (not gated by corpus-wide
    # reference frequency), so a larger lambda would systematically favour
    # definitions over well-matched usage sites even when the usage IS the
    # better answer to the query.
    lambda: 0.15

  docstring_dedup:
    # UPG-RUST-DEF-EVICTION / DEF-C: a second, independent dedup key
    # (alongside the existing byte-normalized full-content key, UPG-2.2)
    # keyed on a chunk's normalized LEADING docstring/comment block only.
    # Near-duplicate boilerplate headers (the same rustdoc/JSDoc/docstring
    # copy-pasted across several thin wrapper/test chunks with otherwise
    # different bodies) evade the full-content key but still bury the
    # canonical definition under several near-identical-looking results.
    # `lines` bounds how many leading doc lines are compared (matches the
    # dual-vector purpose-text docstring cap's spirit — a header is a header,
    # extra lines rarely add distinguishing signal). `min_chars` is a floor
    # on the normalized header's length below which a chunk is NEVER folded
    # into this key (chunks with a trivial/near-empty leading header, or none
    # at all, keep every occurrence — collapsing on near-nothing would fold
    # together unrelated chunks that merely share a blank or 1-word header).
    lines: 3
    min_chars: 20
    # LANE-P1-DEDUP hardening: a matching leading-docstring key alone is
    # NOT sufficient grounds to collapse two chunks — a trait/interface and
    # its own impl, or two genuinely different overloads, commonly carry the
    # identical copy-pasted one-line doc summary while implementing something
    # different; folding them together would silently destroy a correct
    # result, which is worse than the wasted result-list slot this dedup key
    # exists to free up. Two independent, content-only gates run before a
    # docstring-key match is allowed to actually collapse a candidate into an
    # existing representative (agent/searcher.py::_is_near_duplicate_body):
    # (1) a STRUCTURAL gate — when both chunks carry a recorded `node_type`
    # and the two differ (e.g. `trait_item` vs `impl_item`), never collapse,
    # full stop, no threshold involved; (2) a CONTENT-SIMILARITY gate — the
    # two chunks' full normalized bodies (difflib.SequenceMatcher ratio, not
    # just the leading doc) must be at least `body_similarity_min_ratio`
    # alike. Measured on realistic fixtures (see
    # tests/test_indexer_searcher.py::TestNearDuplicateResultSetCollapse):
    # three near-identical benchmark-script variants sharing one boilerplate
    # docstring (the uv `Lock` witness shape) measure ~0.85-0.89 pairwise; a
    # trait and its impl sharing the same doc comment measure ~0.86
    # (additionally caught by gate 1, since their node_type differs); two
    # constructors sharing only a one-line doc but doing genuinely different
    # work measure ~0.53. 0.75 sits with real margin on both sides of that
    # split without requiring near-byte-identity. Read via
    # config.DOCSTRING_DEDUP_BODY_SIMILARITY_MIN.
    body_similarity_min_ratio: 0.75
    # LANE-P1-DEDUP latency bound: the gate above (SequenceMatcher.ratio on
    # full normalized bodies) is O(1) per PAIR but the collapse loop that
    # calls it is O(n^2) in the exact case gate 2 exists for — many chunks
    # sharing one boilerplate leading doc/comment (a license header,
    # "Returns a reference to the underlying value.") but with genuinely
    # different bodies, so nothing collapses and the kept-representative
    # list under that doc_key grows to n. Each new candidate is compared
    # against at most this many already-kept representatives (the
    # earliest/best-ranked ones under its doc_key) instead of the full,
    # unboundedly-growing list. Fails in the SAFE direction only — a
    # candidate that would have matched a representative past this bound is
    # simply never compared against it and becomes its own separate result,
    # so the worst case this bound can cause is an extra wasted result-list
    # slot (the pre-existing problem DEF-C exists to reduce), never a false
    # collapse. What is compared, when it is compared, is unaffected — this
    # does not truncate content, so it does not change
    # `body_similarity_min_ratio`'s measured margins above. Measured
    # (tests/test_indexer_searcher.py::TestNearDuplicateResultSetCollapse
    # and a throwaway benchmark script, ~2KB bodies, one shared doc_key,
    # nothing genuinely collapses): uncapped, n=60 candidates costs ~5.6s
    # and n=200 costs ~69s (SequenceMatcher.ratio on ~2KB bodies measures
    # ~4ms/pair; comparisons grow O(n^2)); at this default, n=60 costs
    # ~0.5s and n=200 costs ~2.4s — a ~23-29x reduction, and now bounded
    # rather than unboundedly quadratic. `n=60` is
    # `ranking.rerank.top_k_unfiltered`, the realistic common ceiling for
    # candidates reaching this function; `n=200` is
    # `ranking.rerank.pre_filter_fetch_k`, the pre-rerank-path ceiling. Read
    # via config.DOCSTRING_DEDUP_MAX_REPS_COMPARED.
    max_reps_compared: 3

  near_dup_body:
    # DISABLED BY DEFAULT pending measurement (sentinel + user, 2026-08-31).
    # The 0.95 threshold's safety margin was calibrated against ONE witness
    # pair (trait/impl bodies at ~0.857 similarity), and that argument does
    # not survive contact with templated code. Bodies that differ only in an
    # index -- `handler_0`/`compute_0`/`x=0` against `handler_1` and so on --
    # are extremely common in generated clients, dispatch tables and test
    # suites, and they cross 0.95 on character similarity while being
    # genuinely distinct symbols. A lane test that meant to build five
    # NON-duplicates built exactly that shape, and this key collapsed 5
    # results to 1, and 50 to 28, in another.
    #
    # Collapsing a real answer out of a result set is silent: the caller
    # cannot tell a deduped set from a set that never had the answer. That
    # is strictly worse than the wasted-slot defect this key fixes, so it
    # stays off until the collapse rate is measured across the warm corpora.
    # Flip to true only with that evidence.
    enabled: false
    # LANE-NEARDUP-DEDUP: a third, independent dedup key (alongside
    # `seen_content` byte-identical UPG-2.2 and `seen_docstring` DEF-C) that
    # catches near-duplicate FULL CONTENT (chunk body, not just leading
    # docstring) for the case DEF-C cannot reach: chunks whose leading
    # docstrings differ but whose bodies are still near-verbatim restatements
    # of each other (a function pair that copy-pasted one boilerplate prose
    # header each, but landed on essentially the same implementation; two
    # thin wrapper modules whose one-liner headers don't share a token yet
    # whose bodies are byte-near-identical). DEF-C keys on a shared leading
    # docstring, so it can never match those — they need a key that looks at
    # the content directly.
    #
    # The threshold here is much higher than DEF-C's 0.75: DEF-C catches
    # "boilerplate header over genuinely different bodies" (the
    # near-duplicate-docstring case), so its 0.75 has to leave headroom for
    # the trait/impl + overload false-collapse guard. This lane is for the
    # OPPOSITE failure mode (truly-near-identical content), so the threshold
    # sits well above the trait/impl body similarity measured for DEF-C
    # (~0.857): 0.95 keeps a wide margin above any plausible "two genuinely
    # different functions discussing the same subject" case. 0.95 catches
    # verbatim or nearly-verbatim text (one or two rephrased tokens, the rest
    # identical) and skips everything below it.
    #
    # Fails in the SAFE direction: a chunk whose body is at similarity
    # 0.94 with an already-kept representative is left as its own result, the
    # wasted slot is the pre-existing defect this lane exists to reduce
    # (never a false collapse).
    body_similarity_min_ratio: 0.95
    # Latency bound: a chunk's content is compared against at most this many
    # already-kept representatives (the earliest/best-ranked ones) instead of
    # the full, unboundedly-growing list. O(n*k) instead of O(n^2) in the
    # pathological case (many chunks that are pairwise-similar to within
    # 0.94 of each other but never genuinely collapse). Same shape and
    # same safe-failure direction as DEF-C's max_reps_compared above. Read
    # via config.NEAR_DUP_BODY_MAX_REPS_COMPARED.
    max_reps_compared: 3

  locate_ranking:
    # UPG-15.10: scope-depth + line-span signals for locate ranking.
    # These penalise class/function definitions that are buried inside function
    # bodies (inner test-scope defs) and reward large, substantive definitions.

    # Line-span threshold (in lines) above which a symbol definition is considered
    # "large" — typically a canonical library class or function.  Symbols with
    # end_line - start_line >= this value get the best span bucket (0).
    # A large web framework's ORM base class has ~1400 lines; real functions are ≥10 lines.
    # Test-inner stubs are typically 2–5 lines.
    large_span_threshold: 50

    # Line-span threshold below which a symbol definition is considered "tiny" —
    # a stub or inner test class.  Symbols with span < this value get the worst
    # span bucket (2); spans in [small, large) get bucket 1.
    small_span_threshold: 10

  rerank:
    # Cross-encoder reranker model (HuggingFace id). The VECTR_RERANKER_MODEL
    # env var overrides this key (test fixtures rely on that); an empty value
    # disables reranking entirely. Swapping this model needs no reindex —
    # the reranker scores (query, chunk) pairs at query time only.
    #
    # UPG-RERANKER-SWAP-SPIKE (2026-08-19): swapped from BAAI/bge-reranker-base
    # after a full-pipeline A/B on the django acceptance corpus. bge is an NL
    # passage ranker that inverts relevance on code — it scored QuerySet.get at
    # 0.0275 on "get object by primary key" while scoring SingleObjectMixin.
    # get_object 0.9258, and BaseCache 0.0019 on "caching framework
    # implementation". Truncation was ruled out (all chunks under the 512 cap),
    # so this was model miscalibration on the code domain, not a context-length
    # artifact. At the shipped pool depth below, gte scores 43/57 auto-verdict
    # cases and 5 of the must-pass six against bge's 35/57 and 3/6.
    # Costs ~1957ms median rerank vs bge's ~1634ms on M1 MPS at batch_size 4.
    # 574MB on disk (bge: 1.1GB), ~4.6s warm load, no trust_remote_code needed.
    model: "Alibaba-NLP/gte-reranker-modernbert-base"

    # rerank this many hybrid candidates before trimming to n_results
    top_k: 40

    # When no language filter is set, doc prose dominates the shallow hybrid pool and
    # real implementation chunks fall outside it (audit: extractor.py / chunk_file never
    # fetched). Fetch a deeper pool in that case so the quality prior has code to surface.
    #
    # THIS, not top_k above, is the knob that governs almost every real query:
    # top_k applies only to the language/path-filtered branch, and 0 of 65 django
    # acceptance cases set a language filter (UPG-RERANK-LATENCY-BUDGET, 2026-08-19).
    # Cross-encoder cost is linear in pairs, and the effective pool runs ~1.2x this
    # cap because it is a union of the vector-order and BM25-order arms.
    #
    # Lowered 60 -> 40 alongside the reranker swap. Measured frontier for the
    # shipped model across {10,20,30,40,60}: 599/1074/1580/1957/2681 ms median
    # against 40/41/41/43/44 cases passing and 4/5/4/5/5 of the must-pass six.
    # 40 rather than 20 deliberately: must-pass-six is NON-MONOTONIC because F22
    # flips across the sweep (verified deterministic by a byte-identical rerun on
    # a fresh daemon), so 20's 5/6 is an isolated peak between two 4/6 dips while
    # 40 and 60 form a contiguous 5/6 plateau. Robustness over the better headline.
    # All of this is django-only evidence; pool depth interacts with corpus chunk
    # density in a way model choice does not, so cross-corpus validation is open.
    top_k_unfiltered: 40

    # Cross-encoder max sequence length in tokens. A (query, chunk) pair
    # longer than this is truncated before scoring. Sibling of model/top_k
    # above — was hardcoded in agent/searcher.py before UPG-RERANK-LATENCY-BUDGET.
    max_length: 512

    # predict() batch_size for the reranker cross-encoder, keyed by the
    # resolved torch device (agent/searcher.py reads CrossEncoder.device.type
    # after load -- the SAME attribute sentence_transformers itself populates
    # when device is left unset; this is not a second device-detection path).
    # UPG-RERANK-LATENCY-BUDGET measured a 40-query sweep with realistic
    # 59-92-pair candidate pools (benchmarks/reranker_spike/, branch
    # upg/reranker-swap-spike) against both shipped reranker models
    # (BAAI/bge-reranker-base, Alibaba-NLP/gte-reranker-modernbert-base).
    # Rank order (top-1 and top-5 set) was verified IDENTICAL to batch_size 32
    # at every tested value on mps -- batch_size only changes wall-clock time,
    # never which chunks come back or in what order.
    #   mps (Apple M1, measured): batch_size 32 (the previous unconfigured
    #     sentence_transformers default) is the WORST value in the sweep --
    #     smaller batches parallelize better under Metal for this pool-size
    #     range. batch_size 4 is 1.97x faster than 32 for bge-reranker-base
    #     (2471ms -> 1252ms median per call) and 1.53x faster for
    #     gte-reranker-modernbert-base (4067ms -> 2656ms).
    #   cpu (Apple M1 / ARM, measured, 5-thread cap matching
    #     embedding.thread_cap -- the same torch.set_num_threads applied
    #     process-wide by LocalEmbedProvider construction, so this mirrors
    #     production CPU-path threading): same direction as mps -- batch_size
    #     32 is again the WORST value, batch_size 4 the best -- but a smaller
    #     magnitude effect. batch_size 4 is 1.70x faster than 32 for
    #     bge-reranker-base (4450ms -> 2610ms mean-of-medians) and 1.49x
    #     faster for gte-reranker-modernbert-base (6297ms -> 4219ms).
    #     Measured on Apple Silicon (ARM) only -- not verified on x86/Intel/
    #     AMD CPU hardware, so the magnitude (not necessarily the direction)
    #     could differ there.
    #   cuda: UNMEASURED -- no CUDA hardware was available to verify this.
    #     Larger batches are normally faster on CUDA, the opposite direction
    #     from the mps/cpu result above, so guessing a small value here would
    #     risk silently regressing CUDA throughput with no local way to catch
    #     it. Keeps sentence_transformers' own unconfigured default (32)
    #     until someone measures it on real CUDA hardware.
    #   default: fallback for any other/unrecognized resolved device string
    #     (npu, xpu, hpu, or a future torch backend) -- same reasoning as
    #     cuda above, preserve the library default rather than guess.
    batch_size:
      mps: 4
      cpu: 4
      cuda: 32
      default: 32

    # Over-fetch depth for the pool-entry trivial filter (UPG-15.7).
    # Before trimming to top_k_unfiltered, the hybrid retrieval fetches this many raw
    # candidates, drops any that are trivial (is_trivial_chunk == True) and not
    # forced-inclusion candidates, THEN trims to top_k_unfiltered.  This ensures the
    # rerank pool of ~60 is filled with real code even on fixture-heavy repos
    # (a large web codebase can carry a hundred-plus 1–2-line HTML/TXT template
    # chunks that otherwise crowd out code).
    # Rule: pre_filter_fetch_k must be >= top_k_unfiltered.  ~200 covers such
    # fixture blocks while remaining a tiny fraction of a 40k-chunk corpus.
    # The cross-encoder reranker only sees ~top_k_unfiltered (~60) candidates, so latency
    # is unaffected by this wider initial fetch.
    pre_filter_fetch_k: 200

  notfound_floor:
    # UPG-NOTFOUND-FLOOR (F46): the score shown to the caller is the FINAL
    # rank-based composite (searcher._apply_quality_and_dedup: base = 1 -
    # rank/n, then quality/importance multipliers) — it is re-derived from
    # each query's own candidate ORDER, so the top result of any query always
    # displays close to 1.0 even when every candidate is irrelevant. A signal
    # independent of that per-query rescaling is needed to tell the caller
    # the whole result set may be a guess.
    #
    # UPG-NOTFOUND-FLOOR-2: the first version of this signal gated on the raw
    # pre-rerank vector-search cosine similarity (the one score in the
    # pipeline NOT re-normalized per query) against an absolute constant
    # (dense_score_floor). Measured against the production embedder on a
    # large real corpus, that constant never fires: an absent-topic query's
    # best pool cosine and a genuinely on-topic query's best pool cosine
    # overlap the same ~0.60-0.86 band (one nonsense string measured HIGHER
    # than several real on-topic queries) — every sentence embedding this
    # model produces lands close to the corpus centroid regardless of
    # relevance, so no absolute cosine constant can separate the two
    # classes. (One parenthetical data point from a large web-framework
    # corpus: the query "CORS handling implementation" — a protocol
    # that framework's own source never touches — still measured a pool-max cosine
    # of 0.75, comfortably inside the on-topic band.) The defect was the
    # signal, not the threshold.
    #
    # The replacement is distributional rather than absolute: does every
    # content word in the query occur, even once, anywhere in the corpus's
    # indexed vocabulary? A query naming a concept the codebase genuinely
    # does not contain is built from at least one word that has literally
    # zero document frequency across the whole corpus (not just the
    # query's fetched candidate pool); a query about something the
    # codebase does contain, however badly it is then ranked, is built
    # entirely from words that really do appear in it. This generalizes
    # past absolute-cosine floors to any embedder vectr ships, because it
    # never looks at a cosine value at all — only at whether the corpus's
    # own vocabulary contains the query's words.
    enabled: true

    # A query token shorter than this is excluded from the zero-document-
    # frequency check — very short tokens (2-letter abbreviations, stray
    # punctuation fragments) are too ambiguous to serve as a reliable
    # vocabulary anchor in either direction.
    min_content_token_length: 3

    # Generic English/query-scaffolding words excluded from the zero-
    # document-frequency check. These are near-universal across any real
    # codebase's comments and docstrings (so they would essentially never
    # have zero document frequency) — excluding them only avoids wasted
    # per-query token lookups, it does not change which queries get
    # flagged.
    stopwords:
      - the
      - a
      - an
      - of
      - to
      - in
      # Quoted: bare "on"/"off"/"yes"/"no" are YAML 1.1 boolean literals — an
      # unquoted "on" here is parsed as the Python bool True, not the string
      # "on", corrupting this list (agent/config.py loads with pyyaml's
      # default YAML 1.1 resolver).
      - "on"
      - for
      - and
      - or
      - is
      - are
      - how
      - what
      - does
      - do
      - implementation
      - code
      - framework
      - using
      - use

    # Minimum number of query content tokens with zero corpus-wide document
    # frequency required to flag the result set low_confidence. 1 (default)
    # flags as soon as a single content word never appears anywhere in the
    # indexed corpus. Set arbitrarily high (or set enabled: false) to
    # disable — the floor never fires and low_confidence is always false,
    # i.e. an exact no-op restoring pre-UPG-NOTFOUND-FLOOR behaviour.
    min_zero_df_tokens: 1

    # UPG-SCORE-DISPLAY-FLAT: a second, independent low-confidence sub-signal —
    # the top result's own displayed relevance is below this absolute floor.
    # Gated on the cross-encoder relevance score specifically (ce_relevance),
    # never on the raw dense-cosine fallback: the UPG-NOTFOUND-FLOOR-2
    # measurement above already showed a bi-encoder cosine cannot separate
    # absent-topic from on-topic queries, so flooring on it here would
    # reintroduce that same defect. A cross-encoder score is a different,
    # calibrated relevance judgment (trained to predict query-doc relevance
    # directly), so it is safe to floor on. A no-op (this sub-signal never
    # fires) whenever reranking didn't run (rerank=False, or the reranker
    # model failed to load) — low_confidence then falls back to the
    # zero-document-frequency check above alone.
    min_top_relevance: 0.30

    # UPG-NOTFOUND-FLOOR-CE-OVERRIDE: high-confidence override on the zero-
    # document-frequency trigger above. The zero-DF check fires when a query
    # content word never appears in the corpus's BM25 vocabulary — but an
    # everyday PARAPHRASE of a symbol the corpus genuinely contains (e.g. "bill
    # a customer credit card" for PaymentProcessor.charge_card) is built from
    # common words a small corpus may simply lack, while the cross-encoder
    # still judges the top result decisively relevant (0.988 observed). Firing
    # the banner there steers the caller to grep away a correct answer. When
    # the top result's calibrated cross-encoder relevance (ce_relevance) is
    # >= this value, the zero-DF trigger is suppressed. This is a threshold
    # comparison on an already-computed score, NOT query-side classification;
    # gated on ce_relevance only (never the raw dense-cosine fallback, per the
    # UPG-NOTFOUND-FLOOR-2 evidence above). The independent low_top_relevance
    # sub-signal is untouched, and is mutually exclusive with a high CE by
    # construction, so a genuine miss (top CE well below min_top_relevance) is
    # never suppressed. Calibrated on the acceptance fixture: genuine misses top
    # out at ce_relevance ~0.04-0.19, confident matches at ~0.72-0.998, so a
    # 0.70 threshold cleanly separates the two. Set above 1.0 to disable (no
    # ce_relevance can ever meet it) — an exact no-op restoring the prior OR.
    ce_override_min_relevance: 0.70

    # Text prepended to the MCP vectr_search response when the floor fires.
    # Results are still shown in full below it — the caller LLM may still
    # salvage a lead; this only adds a signal it currently has no way to see.
    banner: "No strong match for this query — the results below scored low on absolute relevance and may be unrelated. Try vectr_locate with the exact symbol name, rephrase the query, or fall back to grep/reading the file directly."

    # UPG-CLI-SEARCH-FLOOR: separate CLI-surface banner, printed by `vectr
    # search` when SearchResponse.low_confidence is true. The MCP banner
    # above names `vectr_locate` — meaningless at a shell prompt, since no
    # `vectr locate` subcommand exists. Same signal, phrasing for a human
    # terminal reader instead of the editor's LLM.
    banner_cli: "No strong match for this query — the results below scored low on absolute relevance and may be unrelated. Try an exact symbol name, rephrase the query, or fall back to grep/reading the file directly."

  relative_cliff:
    # UPG-BANNER-CALIBRATION Phase 3: an ALTERNATIVE low-confidence sub-
    # signal — the rank-1-to-rank-2 cross-encoder relevance cliff. Tests
    # whether the top result decisively leads the next, or whether the
    # two are essentially tied on a shared weak base. The Phase 1
    # distribution study (django + tigerbeetle, 65 queries, current
    # default reranker) showed that the absolute `min_top_relevance`
    # floor above never fires under gte-reranker-modernbert-base (its
    # compressed range lifts every class into 0.5-0.97), and a
    # preliminary rank-1-vs-rank-2 cliff check on django showed no clean
    # separation either. A relative-cliff test is the third alternative
    # the measurement on the missing three corpora (react, cpython, uv)
    # is meant to evaluate. This entry ships the MECHANISM behind a
    # config switch so the reviewer can measure it; it does NOT change
    # the default. enabled: false keeps low_confidence byte-identical
    # to the pre-this-feature behaviour — an exact no-op. A future
    # default change requires Phase 3 measurement evidence on all five
    # warm corpora and a separate product decision (Rail 7).
    enabled: false
    # Absolute floor (UPG-SCORE-DISPLAY-FLAT scale) below which a
    # rank-1 cannot credibly lead a set. A rank-1 well under this bar
    # is not a confident result regardless of how wide the drop to
    # rank-2 looks; the cliff only matters on a top result that has
    # any business being a top result. Same scale as
    # min_top_relevance above — a calibrated cross-encoder relevance
    # in [0, 1], never the raw dense-cosine fallback (UPG-NOTFOUND-
    # FLOOR-2: a bi-encoder cosine cannot separate absent-topic from
    # on-topic, so reusing it here would re-introduce that defect).
    min_top: 0.30
    # Required gap between rank-1 and rank-2 expressed as a SHARE OF
    # REMAINING HEADROOM above rank-1:
    #     (score[0] - score[1]) >= min_drop * (1 - score[0])
    # rather than a fixed score difference. Displayed scores are
    # bounded in [0, 1] so a constant margin is structurally
    # unsatisfiable on any confident query (the score_order_explain
    # rationale above, restated for this signal): once score[0]
    # reaches 2/3, no gap however large can clear a fixed 0.10
    # margin. The headroom formulation degrades gracefully with
    # rank-1 confidence. 0.50 means "rank-2 must score at least half
    # the range still available below rank-1 lower than rank-1",
    # which is the same shape the score_order_explain entry already
    # uses (UPG-GATE-V4-MINORS). The exact value is the Phase 3
    # question the distribution study answers; 0.50 is a placeholder
    # that the enabled=false default never exercises. Set enabled:
    # true and tune this against the distribution output.
    min_drop: 0.50

  score_order_explain:
    # UPG-SCORE-ORDER-EXPLAIN: displayed absolute relevance may disagree with
    # display order (the composite quality/importance priors decide order, not
    # the displayed score — see quality_priors above). When a result below rank 1
    # shows a MUCH higher relevance than rank 1, annotate WHY it ranks lower from
    # the prior that demoted it, so the divergence is readable rather than
    # silently misleading. Additive, deterministic, chunk-property-based — never
    # reorders anything (no query-side logic).
    enabled: true
    # Only annotate a large divergence. UPG-GATE-V4-MINORS: the divergence
    # measure is now a SHARE OF REMAINING HEADROOM, not a fixed multiple of
    # rank-1's score. Displayed scores are bounded in [0, 1], so the old
    # ratio rule ("lower result scored >= margin_ratio * rank-1") was
    # structurally unsatisfiable on confident queries: once rank-1 reached
    # 2/3, NO inversion however large could ever be annotated (measured gate
    # witness: rank-1 0.864 vs a rank-5 0.969 went unannotated). The required
    # absolute gap instead shrinks as rank-1 approaches the ceiling —
    # annotate iff (score - top_score) >= min_headroom_ratio * (1 -
    # top_score), i.e. the inversion consumes at least this share of the
    # score range still available above rank-1. Calibrated between two
    # pinned cases: 0.80 -> 0.90 consumes 50% of the remaining range
    # (near-tie, left unlabeled); 0.864 -> 0.969 consumes ~77% (annotated).
    # Mild inversions are still left unlabeled to avoid noise.
    min_headroom_ratio: 0.65

  result_floor:
    # UPG-RESULT-FLOOR: an absent-topic query still draws n_results nearest
    # neighbours out of the ANN index; after cross-encoder rerank these render at
    # ~0.000 relevance — real neighbours, but noise the caller pays tokens to
    # read. Drop results whose absolute cross-encoder relevance is below this
    # floor rather than returning a full n_results block of them. Gated on
    # ce_relevance ONLY (never the dense-cosine fallback — a bi-encoder cosine
    # cannot separate absent-topic from on-topic, UPG-NOTFOUND-FLOOR-2), and the
    # single strongest result is always kept so the low-confidence banner always
    # leads a best guess. Deterministic, score-property-based; no query-side logic.
    enabled: true
    min_relevance: 0.02

  pointer_mode_retain:
    # UPG-POINTER-MODE-UNIFORM-STRIP: when low_confidence fires, pointer mode
    # (UPG-LOWCONF-OUTPUT-SLIM / UPG-FLOOR-SLIM-PAYLOAD) strips the body from
    # EVERY result in the set uniformly — including one whose own score
    # independently clears a confidence floor (observed: the correct chunk
    # sat in the pool at the set's highest absolute relevance yet still
    # rendered as a bare pointer, because the flag is set-wide, not
    # per-result). This is a per-result override: a result whose own
    # ce_relevance meets this floor keeps a bounded excerpt of its body
    # (never the full body — see excerpt_lines) and is labeled as
    # individually strong, even while the surrounding set is still flagged
    # low confidence overall. Gated on ce_relevance ONLY, never the raw
    # dense-cosine fallback — a bi-encoder cosine cannot separate
    # absent-topic from on-topic queries (UPG-NOTFOUND-FLOOR-2), so it
    # cannot anchor a per-result floor either. Deterministic,
    # score-property-based; no query-content logic.
    enabled: true
    # UPG-BANNER-CALIBRATION: previously this reused the exact same scalar as
    # ranking.notfound_floor.min_top_relevance (0.30) — which is a structural
    # deadlock, not a coincidence, for the one sub-signal that most needs the
    # escape hatch. When low_confidence fires via that sub-signal, it is
    # BECAUSE the top (rank-1) result's own ce_relevance is < min_top_relevance
    # — so a retain floor set >= min_top_relevance can mathematically never
    # pass for the exact result that triggered the flag, on any reranker or
    # corpus (F47 measured: rank-1 correct, ce_relevance 0.024, banner fired,
    # zero code delivered, forcing a second vectr_fetch round trip — the
    # inverse of vectr's core promise). Lowering this constant on its own
    # widens the escape hatch for OTHER ranks whose score falls between the
    # two floors, but cannot rescue rank-1 by construction. This value is now
    # genuinely independent of notfound_floor.min_top_relevance rather than
    # deliberately tied to it, and governs ranks 2+ only; rank-1 is exempted
    # below via retain_rank1_always regardless of this number.
    # UPG-BANNER-CALIBRATION Phase 1 measurement (django + tigerbeetle, 65
    # queries, current default reranker gte-reranker-modernbert-base): no
    # single absolute value in [0, 1] cleanly separates known-good from
    # known-miss or known-absent CE scores under either the current reranker
    # (all three classes overlap in a narrow 0.5-0.97 band) or the prior
    # bge-reranker-base default (all three classes overlap in a 0.02-0.99
    # band per the pre-existing config comment on ce_override_min_relevance).
    # That measurement is precisely why this constant is LEFT AT 0.30. The
    # deadlock above is fixed structurally, by rank, via retain_rank1_always
    # below; it needs no new number, and this lane's own distribution study
    # supports no particular value for ranks 2+. Moving it without separation
    # evidence would replace one uncalibrated constant with another and call
    # it a fix. Recalibrating this bar is UPG-BANNER-CALIBRATION Phase 3, and
    # depends on whichever cross-encoder is the default at calibration time.
    min_relevance: 0.30
    # UPG-BANNER-CALIBRATION: the composite-top (rank-1) result of a
    # low-confidence set always keeps its excerpt, regardless of
    # min_relevance above. Mirrors the existing result_floor precedent
    # ("the single strongest result is always kept so the low-confidence
    # banner always leads a best guess") but extends it from "stays in the
    # list" to "keeps its body" — a rank-based, CE-scale-agnostic exemption
    # that needs no calibrated absolute number, so it survives untouched
    # across any future reranker swap or recalibration of min_relevance
    # above. Deterministic, rank-property-based; no query-content logic.
    retain_rank1_always: true
    # Bounded excerpt length (lines) for a retained result — deliberately
    # smaller than the normal 80-line display cap (UPG-11.4-b) so a
    # low-confidence set with several individually-strong results still
    # stays token-bounded; vectr_fetch(ids=[...]) restores the rest.
    excerpt_lines: 20
    # Phrase attached to a retained result's pointer line when it clears
    # min_relevance above, so the caller LLM knows why this entry differs
    # from its low-confidence neighbours.
    label: "individually strong — clears the confidence floor despite the low-confidence set"
    # UPG-BANNER-CALIBRATION: separate phrase for the retain_rank1_always
    # case, which is not a "clears the floor" claim (the result may score
    # under min_relevance, or have no ce_relevance at all when reranking
    # didn't run) — it is retained purely because it is the set's best guess.
    rank1_label: "top-ranked result — always shown as a best guess despite the low-confidence set"

strategy:
  # Fallback hybrid-search weights used before the first index-time codebase
  # fingerprint has run (agent.strategy_selector.select_strategy). Once a
  # workspace is indexed these are superseded by the fingerprint-derived
  # RetrievalStrategy; until then `status` and `search` use this pair so
  # retrieval behaviour — and its reporting — is deterministic from the very
  # first call rather than silently absent (UPG-8.2). Must sum to 1.0.
  default_semantic_weight: 0.70
  default_bm25_weight: 0.30
  # Widely-adopted frameworks the caller model already knows at implementation
  # depth from training — when one is detected in the fingerprint and the store
  # already holds notes, suggest_instruction_style() picks "memory-first"
  # (the model needs recall, not a guided map). Detection targets, not benchmark
  # witnesses (UPG-KNOWN-FRAMEWORKS-CONFIG): the list is config-declared so it
  # can be tuned without a code change, matching the framework-detection pattern
  # elsewhere. Matched case-insensitively against fingerprint.detected_frameworks.
  known_frameworks:
    - django
    - flask
    - fastapi
    - react
    - nextjs
    - vue
    - angular
    - express
    - spring-boot
    - gin
    - echo
    - celery
retrieval:
  dual_vector:
    # ARCH-4: per-symbol dual-vector pool entry. STEP-0 spike proved a mechanical
    # implementation body dilutes the intent-bearing signature/docstring tokens
    # when mean-pooled into a single embedding — a documented method can miss
    # dense pool entry entirely even though its own docstring paraphrases the
    # query. Fix: embed a second, body-stripped "purpose" text (qualified
    # signature + docstring/leading comment) per symbol-bearing chunk and query
    # both vector spaces; the two are merged uniformly for every query, never
    # gated on query content. Non-symbol chunks (docs/markdown/config) are
    # unaffected — no purpose vector is stored for them.
    enabled: true

    # How a chunk's two similarity scores (body, purpose) combine into the one
    # dense score consumed by pool entry and the hybrid merge:
    #   "max"      — dense_score = max(body_sim, purpose_sim). A chunk enters the
    #                pool if EITHER vector matches; never scores worse than a
    #                body-only search would. This is the evidence-gated choice:
    #                the spike showed purpose_sim clears pool-entry threshold
    #                while body_sim does not (0.601 vs 0.706 for one phrasing),
    #                so averaging the two would still leave the chunk short —
    #                only a non-averaging max recovers pool entry.
    #   "weighted" — dense_score = (1 - blend_weight) * body_sim + blend_weight *
    #                purpose_sim. Kept as an evaluated alternative for future
    #                tuning; not the default because averaging re-introduces the
    #                dilution the mechanism exists to defeat.
    blend_mode: "max"

    # Purpose-vector weight when blend_mode is "weighted" (ignored under "max").
    blend_weight: 0.5

    # Maximum lines captured as a chunk's "signature" when distilling the
    # purpose text — the declaration line(s) up to (and including) the line that
    # opens the body (python ':' / brace-block '{'). Bounds pathologically long
    # multi-line parameter lists.
    max_signature_lines: 8

    # Maximum lines captured from a Python docstring (or a non-Python leading
    # doc-comment block) when building the purpose text.
    max_docstring_lines: 12

    # Maximum characters kept from the captured docstring/leading-comment text —
    # a hard cap so a very long module-style docstring doesn't itself dilute the
    # purpose embedding the same way a long body would.
    max_docstring_chars: 600

search:
  identifier_hint:
    # UPG-QUERYTYPE-REROUTE: additive, high-precision symbol-graph hint
    # appended below vectr_search's L3 results. Replaces the deleted
    # agent/query_router.py regex query-classification layer, which
    # misrouted innocent NL questions containing bare nouns like
    # "dependency"/"override"/"subclass" into a CALL_GRAPH intent — silently
    # overriding the fingerprint-derived semantic weight and guessing a
    # same-named homonym via the query's first non-stopword word, with no
    # ranking tie to the query at all. This mechanism does no intent
    # classification: it tokenizes the RAW query for identifier-SHAPED
    # tokens (CamelCase, snake_case, dotted Class.method — a structural
    # transform, never a keyword/phrase match) and appends a section only
    # when at least one token resolves to an EXACT symbol-graph hit (no
    # fuzzy/prefix/substring). A query with no identifier-shaped token, or
    # one whose plain words merely coincide with a symbol name, gets no
    # section and no weight override.
    enabled: true

    # Maximum number of distinct identifier-shaped tokens (query order,
    # deduplicated) attempted against the symbol graph per search.
    max_identifiers: 2

    # Maximum resolved symbol locations shown per identifier.
    max_locations: 3

    # UPG-NEARMISS-SYMBOL-NAMES: when an identifier-shaped token fails EXACT
    # resolution, additively surface the nearest existing symbol NAMES so the
    # caller LLM learns it misremembered a name rather than seeing nothing.
    # Sourced entirely from the symbol graph's own deterministic partial-match
    # machinery (locate_l2's non-exact strategies, plus one bounded prefix-
    # containment check — see SymbolGraph.nearest_symbol_names) — never a
    # semantic guess, and always labeled inexact in the rendered section.
    nearmiss_enabled: true

    # Maximum distinct near-miss symbol names shown, TOTAL across the whole
    # response (not per token) — keeps the addition small even when more
    # than one identifier-shaped token in the query fails to resolve exactly.
    nearmiss_max: 3

    # Minimum length (characters) an existing symbol's name must have to be
    # offered as a prefix-containment near-miss candidate (the token "starts
    # with" that shorter, real symbol name). Prevents a short, generic symbol
    # name (e.g. a 2-3 char helper) from spuriously "matching" as a prefix of
    # many unrelated tokens.
    nearmiss_min_prefix_len: 6

indexing:
  # hard cap — prevents single huge chunks diluting embeddings
  max_chunk_lines: 150

  # Character cap per chunk (UPG-WINDOW-CHUNK-BYTE-CAP). Every LINE-based cap
  # (this section's max_chunk_lines, the window walker's 200-line windows) is
  # defeated by a single long line: a minified JS bundle, a generated SQL dump,
  # or one giant data-fixture line produces an unbounded chunk that costs
  # memory in its embed batch and is truncated away at the embedder's token
  # cap anyway. Any chunk exceeding this many characters is sub-split into
  # bounded pieces (tail stays retrievable — nothing is truncated away).
  # Default headroom: a full 200-line window of dense source averages well
  # under half of this, so ordinary files never hit the cap; it only bites
  # genuinely oversized content.
  max_chunk_chars: 32000

  # lines kept for class-level chunk (sig + docstring + attrs)
  class_header_lines: 40

  # Build-artifact directories excluded from indexing at file-walk time (UPG-15.9).
  # Any path component that ENDS WITH one of these suffixes is treated as a build
  # artifact directory and every file inside it is excluded.  This catches Python
  # egg-info directories (e.g. mypackage.egg-info/) whose
  # SOURCES.txt / PKG-INFO / *.txt files are plain file-path listings with no
  # educational content but high BM25 IDF on module/command identifiers.
  # Rule: suffix match on each path part — "mypackage.egg-info" ends with ".egg-info".
  # Do NOT widen to cover real documentation dirs (docs/, howto/) — only build
  # artifacts whose entire directory is machine-generated have no index value.
  build_artifact_dir_suffixes:
    - ".egg-info"
    - ".dist-info"

  # UPG-JSFLOW-SYMBOLS: Flow-typed `.js` detection. tree-sitter-javascript
  # treats Flow type syntax (`@flow` pragma, `import type {...}`, `: Type`
  # annotations, generics) as ERROR nodes and desyncs the symbol walk —
  # canonical functions go missing and keyword tokens get misattributed as
  # symbol names. Files that signal Flow are parsed with the typescript/tsx
  # grammar instead (which understands type annotations); plain `.js` is
  # unaffected. Detection is a cheap header scan (first `scan_head_bytes`
  # bytes), done once per file parse — never per AST node.
  flow_detection:
    # Bytes scanned from the start of the file when looking for a Flow signal.
    scan_head_bytes: 2000
    # Primary signal: the `@flow` pragma, conventionally in the file's leading comment.
    pragma: "@flow"
    # Secondary signal: Flow-only import syntax, checked within the same head window.
    secondary_markers:
      - "import type "
      - "export type "

  # Dispatch of search/fetch calls made from a live request (REST route or
  # MCP tool dispatch) off the single request event loop, so one slow call
  # to the vector store (e.g. while it is compacting a large collection)
  # cannot block every other in-flight request.
  vector_store_bridge:
    # Worker count of the dedicated executor a search/fetch request's call to
    # the vector store is dispatched to (bulk operations such as a
    # full-workspace index use their own separate thread pool and are not
    # affected by this value). Must stay 1: today every search/fetch call is
    # implicitly serialized because it all ran on the one event-loop thread;
    # raising this lets two such calls touch the vector store concurrently
    # for the first time, a new race this value exists to avoid.
    dispatch_max_workers: 1
    # Seconds a single vector-store call may run before a WARNING is logged
    # naming the call and its elapsed time. Purely observational — the call
    # still completes normally; this only gives visibility into it.
    slow_call_warn_seconds: 5.0

  # Resource governor for bulk indexing (UPG-INDEX-RESOURCE-GOVERNOR).
  # Left unclamped, a full-workspace index runs the embed/upsert batch loop
  # at full multi-core priority, competing with interactive work (the AI
  # editor itself, its language server, other apps) for the same CPU. These
  # settings apply an OS-level priority clamp plus a duty-cycle pacing sleep
  # around each embed batch (both content and purpose-vector passes) so
  # indexing stays gentle by default. `vectr start --foreground-fast` (or
  # VECTR_FOREGROUND_FAST=1) bypasses this section entirely and restores
  # unthrottled full-speed indexing, for dedicated/CI machines where nothing
  # else is competing for CPU.
  index_governor:
    # Master switch for the priority clamp + duty-cycle pacing below.
    # Checkpointing (never losing already-embedded work across a
    # kill/restart) is a correctness guarantee and always applies,
    # independent of this flag.
    enabled: true
    # Fraction of wall-clock time the indexing thread spends doing work
    # rather than sleeping, e.g. 0.5 = work half the time, yield the CPU
    # the other half. 0.5 is a defensible middle ground: it roughly doubles
    # a full-workspace index's wall-clock time in exchange for leaving
    # meaningful CPU headroom for interactive use, without indexing taking
    # so long it never seems to finish. 1.0 disables pacing without
    # touching the priority clamp.
    duty_cycle: 0.5
    # macOS QoS class (see <sys/qos.h>) the indexing thread is set to for
    # the duration of each batch loop. "utility" is Apple's own class for
    # long-running, user-initiated background work with a visible progress
    # indicator (their example: "importing data, cleaning up caches") —
    # exactly this workload. One of: user_interactive, user_initiated,
    # default, utility, background.
    macos_qos_class: "utility"
    # Linux per-thread niceness increment (0-19; higher = lower priority).
    # 10 is the conventional "be nice" renice value — a substantial but not
    # extreme deprioritization, leaving room to go lower (up to 19) for a
    # more aggressive clamp if needed.
    linux_nice_increment: 10
    # A batch whose own embedding work took less than this many seconds is
    # never paced (no post-batch sleep) — keeps a tiny batch (a handful of
    # files, a short tail batch) from paying a pacing sleep that would dwarf
    # the work it's supposed to be proportional to.
    min_batch_seconds_for_pacing: 0.05
    # Persist newly-completed files' mtimes to the on-disk incremental-index
    # cache every N embed batches during Phase 3 (content embedding) and the
    # purpose-vector pass, rather than only once at the very end of the run.
    # 1 = checkpoint after every batch — the strongest guarantee (a
    # kill/restart re-embeds at most the files in the batch that was in
    # flight when it was killed). Raise this on a very large corpus to
    # reduce checkpoint I/O at the cost of more work re-done after a crash.
    checkpoint_every_batches: 1
    # UPG-PURPOSE-PASS-DEFERRAL: run the purpose-vector pass (ARCH-4's
    # second, body-stripped embedding of every symbol-bearing chunk) as a
    # background phase AFTER content (body) embedding finishes, instead of
    # blocking on it inline. On a large corpus the purpose pass roughly
    # doubles total embed time; deferring it means content — what search
    # actually queries first — is ready, and `reindex_in_progress` clears,
    # in about half the time, while purpose vectors continue to backfill at
    # idle priority. Search already degrades gracefully to body-only
    # results while a chunk has no purpose vector yet (query_vector_purpose
    # empty-collection guard) — deferral only widens the window that
    # mechanism already covers, it does not introduce a new one. false
    # restores the pre-deferral synchronous behaviour (purpose finishes
    # before index_workspace() returns), same as --foreground-fast.
    defer_purpose_pass: true

output:
  # Number of lines returned as a snippet with each symbol location.
  # Enough for the AI to understand signature + first few lines of the body.
  snippet_lines: 12

behavior:
  remember_nudge:
    # After this many vectr tool calls without a vectr_remember, the next
    # vectr_search / vectr_locate / vectr_trace response appends an imperative
    # reminder. The counter resets on every vectr_remember call.
    threshold: 10

    # After the threshold fires, re-fires every this many calls so a single
    # dismissal cannot silence it for the rest of the session.
    cooldown: 5

  eviction:
    # Minimum accumulated retrieved-token estimate (since the last auto-eviction
    # hint or session start) required before auto_eviction_hint() will emit the
    # ACTION REQUIRED block.  Gates on real context pressure rather than raw
    # call count — a burst of tiny searches (7-15 line methods, ~30-60 tokens
    # each) does not trigger the hint until meaningful content has been retrieved.
    # Token estimate: len(content) // 4.  At ~100 chars/line, 4000 tokens ≈ 10
    # small methods or 2-3 medium functions.  The explicit vectr_evict_hint tool
    # and /v1/evict endpoint remain ungated.
    retrieved_token_gate: 4000

    # UPG-EVICT-SESSION-SCOPE: maximum number of chunk ids listed as re-fetch
    # keys (`vectr_fetch(ids=[...])`) in the eviction_hint() render. Bounds the
    # hint's own token cost — a session with hundreds of retrieved chunks still
    # gets a short, actionable list rather than every id it has ever seen.
    hint_max_ids: 5

    # UPG-EVICT-SESSION-SCOPE: each MCP session gets its own EvictionAdvisor so
    # one session never sees chunks retrieved by another. Bounds the daemon-
    # wide registry of per-session advisors — oldest session is dropped (LRU)
    # once this many concurrent sessions have been tracked, so a long-running
    # daemon serving many short-lived sessions can't grow this without bound.
    max_tracked_sessions: 50

    # UPG-REMEMBER-BANNER-FATIGUE: auto_eviction_hint()'s escalated
    # "ACTION REQUIRED: call vectr_remember NOW" directive only fires once
    # this many NEW chunks have been retrieved since the caller's last
    # vectr_remember call (or since session start, if it has never called
    # vectr_remember). Right after a vectr_remember, repeating the same
    # urgent directive on the very next retrieval trains the caller to
    # ignore it — the counter gives it a chance to actually comply before
    # escalating again. Below this count, MCP dispatch's existing
    # turn-count soft nudge (behavior.remember_nudge, or nothing) takes
    # over instead; see _should_nudge_remember/_remember_nudge_text.
    # Set in the same order of magnitude as rearm_retrieval_calls (4) above.
    remember_escalation_chunks: 3

    # UPG-EVICT-ESCALATION-GATE-TOO-LOW: companion gate to remember_escalation_chunks,
    # required in ADDITION to it (both must hold). remember_escalation_chunks alone is
    # smaller than a single search's default n_results (5), so on large-chunk corpora
    # one vectr_search call can add >4000 tokens in a single burst — tripping both the
    # chunk-count gate AND the existing retrieved_token_gate at once, right after the
    # caller just complied with vectr_remember. Gating on accumulated TOKENS since the
    # last vectr_remember (not just since the last hint) means a single typical search
    # (~4000 tokens on a large-chunk corpus, per retrieved_token_gate's own comment)
    # cannot cross this threshold alone — it takes roughly two such searches, giving the
    # caller a real chance to act on vectr_remember before repeat pressure builds back up.
    remember_escalation_tokens: 8000

  boot:
    # SessionStart boot recall (UPG-9.2): unconditional directive notes are
    # capped defensively so a workspace with unusually many standing rules
    # doesn't inject an unbounded block every session. Directives are
    # ordered oldest-first (standing rules stay in a stable order).
    max_directive_notes: 100

    # UPG-TASK-NOTE-INJECTION-RECENCY: kind=task notes are current-work
    # state, not relevance-ranked learnings — they are ordered strictly
    # newest-first (ignoring author_trust_score/decay_score) and capped to
    # this many so the boot set surfaces only the freshest checkpoints, not
    # the full task history.
    max_task_notes: 5

  resume:
    # UPG-RESUME-SURFACE: 'vectr resume' / GET /v1/resume / vectr_resume package
    # the SAME task-note selection boot.max_task_notes already bounds (see
    # WorkingContextStore._boot_task_notes) plus open gotchas into one named
    # "pick up where you left off" surface. Only the gotcha section needs its
    # own cap here — the task-note and snapshot sections reuse boot's/
    # snapshot's own selection, nothing new to bound there.

    # Maximum open (non-superseded) kind="gotcha" notes shown, newest first.
    # Same order of magnitude as boot.max_task_notes (5) — a handful of live
    # caveats is useful "where was I" context; the full gotcha history stays
    # reachable via vectr_recall(kind="gotcha").
    max_gotchas: 5

  ingest_traces:
    # Maximum number of "caller/callee not found in the indexed symbol graph"
    # example strings surfaced in the vectr_ingest_traces response text (UPG-7.3).
    # The edge is still ingested — an unresolved name is common and expected
    # (external library, dynamic dispatch target added at runtime, or a symbol
    # kind the static extractor doesn't capture) — this only bounds how many
    # examples are echoed back so a large trace batch doesn't flood the response.
    max_unresolved_examples: 10

  # UPG-TRACE-GRAPH-INCOMPLETE (F40-class, reproduced on vectr_trace): the MCP
  # schema's required parameter is "name", but every symbol-name-bearing tool
  # description has read like a positional example, training callers to guess
  # a different key. Rather than rely on descriptions alone, the dispatch
  # layer accepts these as drop-in aliases for "name" on vectr_locate and
  # vectr_trace — a call using any of them succeeds instead of erroring.
  symbol_name_param_aliases:
    - symbol
    - symbol_name

memory_decay:
  # UPG-MEMORY-DECAY-KIND-SCOPED: per-kind policy for the two age-based
  # memory mechanisms.
  #
  # half_life_days_by_kind feeds decay_old_notes() — a RANKING-ONLY signal
  # (recall()'s default ORDER BY tie-break). Never deletes or hides a note;
  # a low decay_score just sorts a note later among equally-trusted peers.
  #
  # ttl_days_by_kind feeds purge_expired_notes() — a VISIBILITY-ONLY
  # transition. A note whose age crosses its kind's TTL is appended one
  # `expired` note_events row (UPG-MEMORY-STATE-MACHINE §4.1's append-only
  # invariant — never a row DELETE); it stops appearing in default recall()/
  # fire() listings, but its row, event history, and deterrent rendering
  # (`vectr_recall(note_id=N)`) all survive, and `vectr_reinstate` reverses
  # it at any time.
  #
  # `null` in either table means EXEMPT from that path at any age. The only
  # kind exempt from both today is "directive" — a standing rule must never
  # silently lose rank or stop being injected just because it's old. Every
  # kind in VALID_KINDS (agent/working_context_store/_types.py) must have an
  # entry in both tables — a kind missing here is a KeyError at import, not
  # a silently-assumed default (agent/config.py's direct-subscript rule).

  half_life_days_by_kind:
    directive: null    # exempt — a standing rule never loses rank by age
    operational: 14     # env/process facts drift fastest of the ranked kinds
    task: 21              # current-work checkpoints age out with the work itself
    gotcha: 30              # file-anchored caveats stay relevant longer than a checkpoint
    finding: 30               # general learnings — same horizon as gotcha
    reference: 45              # pointers (URLs/tickets) outlive ranked findings
    decision: 60                 # architectural rationale — meant to read as a long timeline

  ttl_days_by_kind:
    directive: null    # exempt — never stops being injected regardless of age
    operational: 60      # stale env/process facts should stop surfacing soonest
    task: 90               # an un-superseded checkpoint older than a quarter is dead weight
    gotcha: 120              # caveats stay live roughly half a year
    finding: 120               # same horizon as gotcha
    reference: 180              # pointers outlive ranked findings
    decision: 240                 # decision history is meant to persist longest

memory_hygiene:
  # UPG-TASK-SUPERSEDES-HYGIENE: kind="task" notes are current-work
  # checkpoints, not relevance-ranked learnings, and (per KIND_DEFAULT_SCOPES)
  # they keep firing at every session-start until explicitly superseded or
  # forgotten — a task note left un-superseded after the work moves on is
  # dead weight that neither this nudge nor memory_decay above removes on
  # its own (memory_decay only reorders/hides by AGE — a task note that's
  # merely young stays fully live and un-nudged no matter how many stale
  # siblings pile up). `vectr_status` surfaces a one-line warning, driven by
  # these two thresholds, when stale task notes accumulate — the caller
  # decides whether to supersede or forget.

  # Minimum number of live (non-superseded, non-tombstoned) kind="task" notes
  # older than stale_task_warn_age_days before the vectr_status warning fires.
  # 3 was picked as "a small pile, not a single stale note" — one old task
  # note is normal (the current checkpoint ages before it's replaced); three
  # or more suggests checkpoints are being left behind instead of superseded.
  stale_task_warn_count: 3

  # Age (in days) after which a kind="task" note counts toward the stale
  # count above. 7 days ≈ "outlived a typical work week" — long enough that a
  # task note genuinely still in progress isn't flagged, short enough that a
  # note from last month's finished work gets surfaced.
  stale_task_warn_age_days: 7

memory_export:
  # UPG-MEMORY-LEGIBLE-FILE-PROJECTION part (a): `vectr memory export` renders
  # the live working-memory notes to a read-only markdown mirror (default
  # MEMORY.md) so a human — or an agent without MCP tool access — can open,
  # grep, and `git diff` memory the way they already do for a hand-written
  # notes file. Nothing ever reads the rendered file back; the database stays
  # the sole source of truth. The mirror is re-rendered from a debounced
  # post-write hook (`_bump_notes_epoch()` in app/service.py) so it never
  # falls far behind, but a write must never be slowed or failed by export
  # work — hence the debounce rather than a synchronous render on every call.

  # Seconds of write-quiet before a scheduled export actually runs, per
  # workspace. A burst of several remember()/revoke()/etc calls in quick
  # succession (e.g. an agent recording multiple findings back-to-back)
  # collapses into a single re-render instead of one per write. 3 seconds is
  # short enough that the file is current well within one human glance at a
  # terminal, long enough to coalesce a realistic same-turn burst.
  debounce_seconds: 3.0

memory_import:
  # UPG-MEMORY-IMPORT: `vectr memory import` walks this list of workspace-
  # relative paths in order when no --path is given, then imports every
  # existing one through the structural section split (heading boundaries)
  # or the export-grammar recovery path (when the file carries the export
  # header comment). The defaults cover the common on-disk memory files a
  # user already has before adopting vectr. Editors that store their rules
  # in a subdirectory (e.g. `.cursor/rules/*.mdc`) are reachable through
  # repeated --path arguments — the closed list here is the WORKSPACE-ROOT
  # discovery set only, and adding a new filename to it is a config-only
  # change. Filenames are data, not product copy: matching
  # `.github/copilot-instructions.md` is the discovery surface, and saying
  # so is honest, the same way the init command names files it writes.

  candidate_files:
    - MEMORY.md
    - CLAUDE.md
    - AGENTS.md
    - .cursorrules
    - .github/copilot-instructions.md

memory_recall_for_path:
  # UPG-PROXY-SUBSTRING-ANCHOR: recall_for_path() answers "which notes are
  # relevant to this file path" for the PreToolUse hook and the proactive
  # matcher's structural candidate. The SQL LIKE prefilter is intentionally a
  # cheap SUPERSET (unanchored substring match can over-match, e.g. "gate.py"
  # inside "uv_regate.py") — a Python-side path-boundary filter narrows the
  # superset down to true matches afterward. Because the boundary filter runs
  # AFTER the SQL fetch, the SQL step must over-fetch more rows than the
  # caller's requested limit, or a true match could be filtered out of a
  # too-small candidate pool before ever being counted.

  # Candidate pool size = min(limit * overfetch_multiplier, overfetch_ceiling).
  # 4x gives the boundary filter enough headroom to discard false substring
  # hits (e.g. several "*_gate.py" siblings) without still finding fewer than
  # `limit` true matches in the common case of a handful of relevant notes.
  overfetch_multiplier: 4

  # Hard ceiling on the SQL-fetched candidate pool regardless of the
  # multiplier above, so a large `limit` from a caller can't force an
  # unbounded table scan. 200 is generously above any realistic per-path
  # note count while keeping the query cheap.
  overfetch_ceiling: 200

recall_floor:
  # UPG-RECALL-MISS-FLOOR parts (b)/(c), revised round 4: a floor that
  # does not depend on matching at all. MEMORY.md-style unconditional
  # injection is not BETTER retrieval, it is NO retrieval — it only works
  # because the file is ~40 lines. At hundreds of notes that stops
  # scaling, so instead of tuning semantic matching further,
  # `WorkingContextStore.recall()` composes two guarantees ahead of the
  # ranked (semantic/SQL) result:
  #   Tier 0 — every explicitly PINNED note, injected unconditionally,
  #     never scored against the query. Round-4 change: directive notes
  #     were DROPPED from Tier 0's candidate predicate (it used to be
  #     `kind == 'directive' or pinned`, now just `pinned`). Reason:
  #     boot_recall() already returns ALL directive notes unconditionally
  #     every session (capped by behavior.boot.max_directive_notes,
  #     default 100) — including them here a second time only charged
  #     query budget for a guarantee that already exists on a stronger,
  #     dedicated channel. The pin is the only note kind with NO other
  #     guaranteed-delivery path, so it is the only kind Tier 0 still
  #     carries; the pin-priority sort this used to need (to pick between
  #     a pinned note and a directive) is gone along with the directive
  #     branch — there is only one candidate kind left to order.
  #   Deterministic channels — OFF BY DEFAULT as of round 4 (see
  #     deterministic_enabled below); when enabled, a note whose OWN
  #     declared tag, anchor basename, trigger symbol, or title token set
  #     is found in the query's text (containment checked against that
  #     note's stored metadata, never a classification of the query) is
  #     guaranteed a slot ahead of pure semantic fill. When more notes
  #     match than fit the channel's cap, the matched set is ranked by
  #     its OWN match specificity (how many distinct declared-metadata
  #     fields matched, then how long/specific the matched text was)
  #     before truncating — never by recency alone (UPG-RECALL-MISS-FLOOR
  #     F2 fix; see _declared_metadata_match_specificity() in
  #     agent/working_context_store/_store.py). See deterministic_enabled
  #     below for why this channel is gated off pending a tighter
  #     predicate.
  # Both tiers are bounded by count so neither can crowd out the ranked
  # result entirely, and the combined result is always truncated to the
  # caller's `limit` (see benchmarks/recall_miss/harness.py's STEP 0
  # guard: a composition may never return more than `limit` notes). With
  # zero pinned notes and deterministic_enabled: false (the shipped
  # default in a workspace that has never pinned anything), `recall()`
  # with apply_floor=True is required to produce byte-identical output to
  # apply_floor=False — nothing may consume budget unconditionally unless
  # a user actually opted into it via a pin.

  # Max notes Tier 0 (pinned notes only, as of round 4) contributes per
  # recall() call, regardless of how many pinned notes exist in the
  # workspace. The candidate pool is ordered by recency (created_at DESC,
  # note_id DESC — see _floor_candidate_pool()); when a workspace holds
  # more pinned notes than this bound, Tier 0 is, in practice, "the
  # tier0_max_notes MOST RECENTLY pinned notes" — an older one can never
  # enter Tier 0 no matter how long it has stood. This is a DELIBERATE,
  # stated bound of the design (recency is a reasonable, deterministic
  # tie-break for an otherwise-unconditional guarantee), not an accident
  # of pool order — see tier0_min_notes below for the separate guarantee
  # this cap must never fall below.
  tier0_max_notes: 5

  # Max notes the deterministic tag/anchor/symbol/title channels
  # contribute per recall() call, on top of (and excluding) whatever
  # Tier 0 already filled.
  deterministic_max_notes: 5

  # UPG-RECALL-MISS-FLOOR F1 fix, revised after review, and again round 4
  # (Tier 0 became pinned-only, this key's shape is unchanged): Tier 0's
  # guaranteed slot count is `max(1, min(this, floor(limit *
  # tier0_max_share_of_limit)))` — never 0 for any `limit >= 1`, but
  # scaled by the SAME share as the ceiling below rather than flat-taxing
  # a tight budget at this full count. 2 gives room for more than one
  # pinned note to survive at once (rather than only ever guaranteeing
  # the single most recent pin); it reaches exactly 2 at recall()'s own
  # production default (limit=10), below that (e.g. limit=5) it degrades
  # to a single guaranteed slot. Before this key existed (first version
  # of this mechanism), a caller passing limit=10 got tier0_cap =
  # int(10 * 0.1) = 1 and limit=5 got 0 (measured live against the real
  # 38-query labeled corpus with a deliberately off-topic query) — both
  # silent failures of the "never 0" requirement, not merely a smaller
  # guarantee than intended.
  tier0_min_notes: 2

  # Upper bound on how many of the workspace's own notes are scanned as
  # Tier 0 / deterministic-channel candidates per call (ordered by
  # created_at DESC, most recent first) — the deterministic channels must
  # check every eligible note's OWN metadata against the query, which has
  # no relevance-ranked shortcut, so this ceiling keeps a single recall()
  # call bounded on a workspace with a very large note count.
  metadata_scan_ceiling: 2000

  # Title channel: a note's title is tokenized the same uniform way as
  # the query (lowercased, split on non-alphanumeric runs); a token
  # shorter than this is dropped from both sides before comparing, so
  # short connector words never count toward the overlap below.
  title_min_token_len: 4

  # Title channel: minimum number of surviving title tokens that must
  # also appear in the query's own token set for the title channel to
  # count as a deterministic hit for that note.
  title_min_overlap_tokens: 2

  # UPG-RECALL-MISS-FLOOR F1/F3 fix: an earlier version of this section
  # picked tier0_max_fraction_of_limit=0.1 / deterministic_max_fraction_
  # of_limit=0.3 by scanning several (tier0, deterministic) combinations
  # against the labeled recall-miss corpus and keeping the pair that
  # scored best — that made the corpus's own measured recall a SELECTED
  # number, not a measured one, and review correctly rejected it (see
  # UPG-RECALL-MISS-FLOOR working notes). Also, at recall()'s own default
  # (limit=10), 0.1 alone gave Tier 0 exactly ONE slot — not enough room
  # for the tier's own acceptance bar ("a directive AND a pinned note are
  # injected at 100%"). The two constants below are instead each a direct
  # restatement of a stated STRUCTURAL principle, independent of any
  # particular query set; see `tier0_min_notes` above for the guaranteed
  # minimum that now always takes precedence over the ceiling below it.

  # Tier 0's upper bound, as a share of the caller's own `limit`, used
  # BOTH to scale tier0_min_notes' guaranteed floor down at a tight
  # `limit` (see tier0_min_notes above) AND as the ceiling
  # tier0_min_notes cannot itself exceed once `limit` grows
  # (_recall_floor_notes: tier0_guaranteed = max(1, min(tier0_min_notes,
  # floor(limit * this))); tier0_cap = min(tier0_max_notes,
  # max(tier0_guaranteed, floor(limit * this)))). Chosen so this share
  # reaches tier0_min_notes exactly at the crossover point tier0_min_notes
  # / this = 2 / 0.2 = 10 — recall()'s own production default. A caller
  # asking for exactly the default result count gets the full guaranteed
  # minimum (2, room for more than one pinned note); a caller asking
  # for meaningfully more lets Tier 0 grow, still capped by
  # tier0_max_notes, toward its full absolute allowance; a caller asking
  # for meaningfully less degrades toward a single guaranteed slot
  # (pin-priority) rather than spending tier0_min_notes' full count
  # unconditionally on a channel that already has a stronger backstop in
  # boot_recall().
  tier0_max_share_of_limit: 0.2

  # The deterministic channel's upper bound, as a share of whatever
  # budget Tier 0 did NOT actually use (limit minus the ACTUAL number of
  # Tier 0 notes returned — which can be below tier0_min_notes/tier0_cap
  # in a workspace with few or no directive/pinned notes), never a share
  # of `limit` directly. 0.5 is the direct arithmetic statement of "the
  # deterministic channel never takes more than the ranked group": at
  # most an equal split of what Tier 0 left behind, so ranked fill is
  # guaranteed at least as many slots as the deterministic channel
  # claims, at any `limit`.
  #
  # NOTED PROPERTY (UPG-RECALL-MISS-FLOOR, measured against the live
  # labeled corpus after the tier0_max_share_of_limit fix above): because
  # this cap is a share of REMAINING, shrinking Tier 0's actual count
  # grows this channel's own cap by roughly the same amount, so the
  # combined tier0+deterministic budget can stay unchanged even when
  # tier0_min_notes/tier0_max_share_of_limit shrink Tier 0 itself — the
  # freed capacity is not guaranteed to reach the ranked group unless a
  # matching deterministic note actually exists to claim it. This is an
  # observed structural consequence of the two formulas composing, not a
  # bug; do not retune either share to chase a specific corpus's numbers
  # (see the F3 note above this section on why that was rejected once).
  deterministic_max_share_of_remaining: 0.5

  # UPG-RECALL-MISS-FLOOR round-4 evidence gate: the deterministic channel
  # ships OFF by default. Measured against the live 38-query labeled
  # corpus, its membership predicate (containment of a note's own tag,
  # anchor basename, trigger symbol, or title-token-overlap against the
  # query text) is too loose to act as a guarantee — mean 50.2 candidate
  # notes matched per query (min 6, max 111) against a mean of ~1 labeled-
  # relevant note; per-channel precision was tag 1.6%, title 4.6%, anchor
  # 0%, symbol 0 matches across the run. A cap-sweep (total floor cap 0..6
  # slots, endpoints reproduced the harness exactly) showed the channel's
  # effect on recall is NOT monotonic in budget (k=5: cap1 +0, cap2 -1,
  # cap3 -2, cap4 -2, cap5 -2, cap6 -2; k=10: cap1 +0, cap2 +0, cap3 +1,
  # cap4 +0, cap5 +0, cap6 +2) — a channel carrying real signal should be
  # roughly monotonic; a jagged walk means the +2 measured at k=10 in an
  # earlier round was noise from a loose predicate consuming budget, not
  # an effect. This is evidence-gating, not deletion: the code, its ranked
  # match-specificity ordering, and its test coverage are all still
  # present and correct (tests flip this flag true to exercise the
  # channel) — a future task can revisit the predicate itself (e.g.
  # requiring 2+ matched channels to enter the pool at all, not just to
  # win a tie) and flip this back on with fresh evidence.
  deterministic_enabled: false

